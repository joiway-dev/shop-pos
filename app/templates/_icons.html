{# Inline stroke icons (drawn for this project, 24x24 grid). Usage: {{ icon("box") }} #}
{% macro icon(name, size=20) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "home" -%}
  <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>
{%- elif name == "cart" -%}
  <path d="M5 7h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8Z"/><path d="M9 7a3 3 0 0 1 6 0"/>
{%- elif name == "box" -%}
  <path d="M12 3 20 7.5v9L12 21l-8-4.5v-9Z"/><path d="M4 7.5 12 12l8-4.5"/><path d="M12 12v9"/>
{%- elif name == "sparkle" -%}
  <path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="m6 6 2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>
{%- elif name == "upload" -%}
  <path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
{%- elif name == "folder" -%}
  <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5Z"/>
{%- elif name == "tag" -%}
  <path d="M3 12V4h8l9 9-8 8Z"/><circle cx="7.5" cy="8.5" r="1.3"/>
{%- elif name == "users" -%}
  <circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.2a3 3 0 0 1 0 5.6"/><path d="M18 14.5a5.5 5.5 0 0 1 3 5.5"/>
{%- elif name == "settings" -%}
  <circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2.1 1.2M17.7 15.3l2.1 1.2M4.2 16.5l2.1-1.2M17.7 8.7l2.1-1.2"/><circle cx="12" cy="12" r="7"/>
{%- elif name == "menu" -%}
  <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>
{%- elif name == "moon" -%}
  <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>
{%- elif name == "sun" -%}
  <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif name == "logout" -%}
  <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/>
{%- elif name == "leaf" -%}
  <path d="M5 19c0-8 5-13 15-14-1 10-6 15-14 15"/><path d="M5 19 13 11"/>
{%- elif name == "search" -%}
  <circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>
{%- elif name == "plus" -%}
  <path d="M12 5v14M5 12h14"/>
{%- elif name == "check" -%}
  <path d="m5 12.5 4.5 4.5L19 7.5"/>
{%- elif name == "local" -%}
  <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>
{%- elif name == "chart" -%}
  <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif name == "layers" -%}
  <path d="M12 3 3 8l9 5 9-5Z"/><path d="m3 13 9 5 9-5"/>
{%- elif name == "truck" -%}
  <path d="M3 6h11v10H3Z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>
{%- elif name == "clipboard" -%}
  <rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 10h6M9 14h4"/>
{%- endif -%}
</svg>
{%- endmacro %}
