<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ระบบร้านวัสดุก่อสร้าง{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx.min.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body>
  {% if user %}
  <nav class="topbar">
    <a href="/">หน้าหลัก</a>
    {% if user.is_owner %}<a href="/settings">ตั้งค่าร้าน</a><a href="/users">ผู้ใช้งาน</a>{% endif %}
    <span class="spacer"></span>
    <span>{{ user.name }} ({{ "เจ้าของร้าน" if user.is_owner else "พนักงานขาย" }})</span>
    <form method="post" action="/logout"><button type="submit">ออกจากระบบ</button></form>
  </nav>
  {% endif %}
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <div class="footer">เวอร์ชัน {{ app_version }}</div>
</body>
</html>
